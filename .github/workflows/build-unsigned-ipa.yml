name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build unsigned iOS app
        run: |
          # Use the top-level CocoaPods-integrated workspace, not the
          # project.xcworkspace nested inside CYOAGM.xcodeproj.
          WORKSPACE=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "Could not find the CocoaPods workspace at ios/*.xcworkspace"
            find ios -maxdepth 3 -name '*.xcworkspace' -print
            exit 1
          fi
          if [ ! -d "ios/Pods/Pods.xcodeproj" ]; then
            echo "CocoaPods project was not generated at ios/Pods/Pods.xcodeproj"
            exit 1
          fi
          echo "Using CocoaPods workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{getline; gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then echo "Could not detect Xcode scheme"; xcodebuild -list -workspace "$WORKSPACE"; exit 1; fi
          echo "Using scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry CYOA-GM-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYOA-GM-unsigned-IPA
          path: CYOA-GM-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
