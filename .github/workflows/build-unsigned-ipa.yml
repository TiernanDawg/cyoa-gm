name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build unsigned iOS app
        run: |
          # Use the top-level CocoaPods-integrated workspace, not the
          # project.xcworkspace nested inside the .xcodeproj.
          # CocoaPods creates ios/CYOAGM.xcworkspace. Never select the
          # nested ios/CYOAGM.xcodeproj/project.xcworkspace: it omits the
          # Pods workspace integration and causes Expo module maps to be absent.
          PROJECT="ios/CYOAGM.xcodeproj"
          WORKSPACE="ios/CYOAGM.xcworkspace"
          if [ ! -d "$WORKSPACE" ] || [ ! -d "$PROJECT" ]; then
            echo "Expected CocoaPods workspace/project was not generated."
            find ios -maxdepth 4 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print
            exit 1
          fi
          if [ ! -d "ios/Pods/Pods.xcodeproj" ]; then
            echo "CocoaPods project was not generated at ios/Pods/Pods.xcodeproj"
            exit 1
          fi
          APP_NAME="CYOAGM"
          echo "Using CocoaPods workspace: $WORKSPACE"
          echo "Expected app scheme/target: $APP_NAME"
          SCHEME_LIST=$(xcodebuild -list -workspace "$WORKSPACE" 2>&1)
          if ! printf '%s\n' "$SCHEME_LIST" | grep -Eq "^[[:space:]]+${APP_NAME}[[:space:]]*$"; then
            echo "Expected app scheme '$APP_NAME' was not found in the CocoaPods workspace."
            printf '%s\n' "$SCHEME_LIST"
            exit 1
          fi
          SCHEME="CYOAGM"
          echo "Building app scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          if [ ! -d "$APP" ]; then
            echo "Xcode completed without producing the expected app bundle: $APP"
            find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -print 2>/dev/null || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry CYOA-GM-unsigned.ipa Payload
          test -s CYOA-GM-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYOA-GM-unsigned-IPA
          path: CYOA-GM-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
