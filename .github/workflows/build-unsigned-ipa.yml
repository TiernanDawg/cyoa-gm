name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate authored stories
        continue-on-error: true
        run: npm run check:stories
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build unsigned iOS app
        run: |
          PROJECT="ios/DeadEnd.xcodeproj"
          WORKSPACE="ios/DeadEnd.xcworkspace"
          if [ ! -d "$WORKSPACE" ] || [ ! -d "$PROJECT" ]; then
            echo "Expected CocoaPods workspace/project was not generated."
            find ios -maxdepth 4 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print
            exit 1
          fi
          if [ ! -d "ios/Pods/Pods.xcodeproj" ]; then
            echo "CocoaPods project was not generated at ios/Pods/Pods.xcodeproj"
            exit 1
          fi
          APP_NAME="DeadEnd"
          SCHEME_LIST=$(xcodebuild -list -workspace "$WORKSPACE" 2>&1)
          if ! printf '%s\n' "$SCHEME_LIST" | grep -Eq "^[[:space:]]+${APP_NAME}[[:space:]]*$"; then
            printf '%s\n' "$SCHEME_LIST"
            exit 1
          fi
          xcodebuild -workspace "$WORKSPACE" -scheme "$APP_NAME" -configuration Release -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION="1.2.0" build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeadEnd.ipa Payload
          test -s DeadEnd.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadEnd
          path: DeadEnd.ipa
          if-no-files-found: error
          retention-days: 14
